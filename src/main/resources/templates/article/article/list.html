<html layout:decorate="~{layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<div layout:fragment="content" class="my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">게시글 목록</h2>
        <a href="/article/create" class="btn btn-primary">글쓰기</a>
    </div>

    <div class="toss-card">
        <div class="table-responsive">
            <table class="toss-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">번호</th>
                        <th style="width: 70%;">제목</th>
                        <th style="width: 20%;">작성일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="article : ${articles}">
                        <td th:text="${article.getId()}"></td>
                        <td>
                            <a th:href="@{|/article/detail/${article.getId()}|}" class="text-decoration-none text-dark fw-medium">
                                [[${article.getTitle()}]]
                            </a>
                        </td>
                        <td th:text="${#temporals.format(article.createDate, 'yyyy-MM-dd HH:mm')}" style="color: var(--toss-text-tertiary);"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(articles)}">
                        <td colspan="3" class="text-center py-5" style="color: var(--toss-text-tertiary);">
                            등록된 게시글이 없습니다.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</html>
