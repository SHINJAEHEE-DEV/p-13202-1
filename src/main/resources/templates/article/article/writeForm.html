
<!-- templates/article/form_fragment.html -->
<div th:fragment="articleForm(actionUrl, buttonText)" class="toss-card">
  <form th:action="${actionUrl}" method="post" th:object="${articleForm}">
    <!--스프링 시큐리티의 CSRF(Cross-Site Request Forgery) 보호 기능이 기본적으로 활성화되어 있기 때문에
action을 POST로 설정한 form을 사용할 때는 CSRF 토큰을 포함해야 함
--><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div th:replace="~{form_erros :: formErrorsFragment}"></div>
    <div class="mb-4">
        <label for="title" class="form-label">제목</label>
        <!-- 수정 페이지일 때 기존 데이터가 채워지도록 th:value 사용 -->
        <input type="text" class="form-control" id="title" name="title" th:field="*{title}" placeholder="제목을 입력하세요">
    </div>

    <div class="mb-4">
        <label for="content" class="form-label">내용</label>
        <!-- textarea는 th:text 또는 th:value를 사용해 데이터를 채웁니다 -->
        <textarea class="form-control" id="content" name="content" rows="10" th:field="*{content}" placeholder="내용을 입력하세요"></textarea>
    </div>

    <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary px-4" th:text="${buttonText}"></button>
    </div>
  </form>
</div>
