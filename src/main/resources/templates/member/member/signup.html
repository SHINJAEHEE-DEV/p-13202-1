<html layout:decorate="~{layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<div layout:fragment="content" class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="toss-card w-100" style="max-width: 400px;">
        <h2 class="text-center mb-4">회원가입</h2>
        <form th:action="@{/members/signup}" method="post" th:object="${memberCreateForm}">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
            <div th:replace="~{form_erros :: formErrorsFragment}"></div>
            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                <input type="text" class="form-control" id="username" th:field="*{username}"  placeholder="아이디를 입력하세요">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="비밀번호를 입력하세요">
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                <input type="password" class="form-control" id="confirmPassword" th:field="*{passwordConfirm}" placeholder="비밀번호를 다시 입력하세요">
            </div>
            <div class="mb-4">
                <label for="nickname" class="form-label">닉네임</label>
                <input type="text" class="form-control" id="nickname" th:field="*{nickname}" placeholder="닉네임을 입력하세요">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">회원가입</button>
            </div>
        </form>
        <div class="text-center mt-4">
            <a href="/article/list" class="text-decoration-none" style="color: var(--toss-text-tertiary); font-weight: 500;">목록으로 돌아가기</a>
        </div>
    </div>
</div>
</html>
